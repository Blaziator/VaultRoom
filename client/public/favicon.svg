<?xml version="1.0" encoding="UTF-8"?>
<!-- Editable vector reconstruction of the supplied Vaultroom app icon. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-labelledby="title">
  <title id="title">Vaultroom logo</title>
  <!-- App-icon field; exterior remains transparent. -->
  <rect width="80" height="80" rx="14" fill="#356AE6"/>

  <!-- White outer room / doorway. -->
  <path fill="#FFFFFF" d="M40 17 61 29.2v25.5L50.5 61V35.7L40 29.6 29.5 35.7v25.5L19 55V29.5Z"/>

  <!-- Recessed blue doorway, with the narrow left plane providing the dimensional split. -->
  <path fill="#2E63CD" d="M40 29.6 50.5 35.7V61L40 54.9V35.7L29.5 41.8v-6.1Z"/>
  <path fill="#2459C2" d="M29.5 35.7 34 38.3v19.2l-4.5 3.7Z"/>
</svg>
